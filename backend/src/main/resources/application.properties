spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studyos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT
app.jwt.secret=${JWT_SECRET:replace-this-with-a-very-long-random-secret-string-at-least-32-bytes}
app.jwt.expiration-ms=86400000

# OpenAI
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=gpt-4o-mini

# Logging
logging.level.org.springframework.security=INFO
